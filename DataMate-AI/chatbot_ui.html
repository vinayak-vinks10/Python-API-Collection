<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinayak AI</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --blue: #0095ff;
      --sky: #38b6ff;
      --bg: #f0f8ff;
      --white: #ffffff;
      --text-dark: #0a1628;
      --text-mid: #3a4a6b;
      --text-light: #8a9bc0;
      --msg-in-bg: #ffffff;
      --msg-out-bg: linear-gradient(135deg, #0095ff, #38b6ff);
      --shadow: 0 8px 32px rgba(0, 100, 255, 0.13);
      --radius: 20px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ═══════════════════════════
     HERO / LANDING
  ═══════════════════════════ */
    .page {
      min-height: 900px;
      background: linear-gradient(135deg, #f0f8ff 0%, #e4f2ff 60%, #d6ecff 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 120px;
    }

    /* decorative blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      animation: floatBlob 9s ease-in-out infinite;
    }

    .blob-1 {
      width: 340px;
      height: 340px;
      background: rgba(56, 182, 255, 0.18);
      top: -80px;
      right: -60px;
    }

    .blob-2 {
      width: 260px;
      height: 260px;
      background: rgba(0, 149, 255, 0.12);
      bottom: -60px;
      left: -40px;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 180px;
      height: 180px;
      background: rgba(56, 182, 255, 0.1);
      top: 40%;
      left: 5%;
      animation-delay: -7s;
    }

    @keyframes floatBlob {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-28px) scale(1.06);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 182, 255, 0.13);
      border: 1px solid rgba(56, 182, 255, 0.3);
      color: var(--blue);
      font-family: 'Sora', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      padding: 7px 18px;
      border-radius: 100px;
      margin-bottom: 28px;
      animation: fadeUp .6s ease both;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: #38b6ff;
      border-radius: 50%;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .4;
        transform: scale(1.5)
      }
    }

    .hero-title {
      font-family: 'Sora', sans-serif;
      font-size: clamp(38px, 7vw, 72px);
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      line-height: 1.1;
      margin-bottom: 18px;
      animation: fadeUp .7s .1s ease both;
    }

    .hero-title .grad {
      background: linear-gradient(135deg, #0066ff, #38b6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 17px;
      font-weight: 300;
      color: var(--text-light);
      text-align: center;
      max-width: 420px;
      line-height: 1.65;
      margin-bottom: 52px;
      animation: fadeUp .8s .2s ease both;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 640px;
      width: 100%;
      margin-bottom: 52px;
      animation: fadeUp .9s .35s ease both;
    }

    .card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 182, 255, 0.2);
      border-radius: 18px;
      padding: 22px 14px;
      text-align: center;
      transition: transform .2s, box-shadow .2s;
      cursor: default;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 36px rgba(0, 149, 255, 0.16);
    }

    .card-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .card-label {
      font-family: 'Sora', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-mid);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ═══════════════════════════
     FAB BUTTON
  ═══════════════════════════ */
    #fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #0095ff, #38b6ff);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0, 149, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: transform .2s, box-shadow .2s;
    }

    #fab:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 32px rgba(0, 149, 255, 0.55);
    }

    #fab:active {
      transform: scale(0.95);
    }

    /* ═══════════════════════════
     CHAT WIDGET
  ═══════════════════════════ */
    #chat-widget {
      position: fixed;
      bottom: 100px;
      right: 28px;
      width: 360px;
      height: 520px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 100, 255, 0.18), 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      z-index: 9998;
      transform-origin: bottom right;
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), opacity .25s ease;
    }

    #chat-widget.hidden {
      transform: scale(0.7) translateY(40px);
      opacity: 0;
      pointer-events: none;
    }

    #chat-widget.visible {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Header */
    .chat-head {
      background: linear-gradient(135deg, #0095ff 0%, #38b6ff 100%);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-head-avatar {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .chat-head-info {
      flex: 1;
    }

    .chat-head-name {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: #fff;
    }

    .chat-head-status {
      font-size: 12px;
      color: rgba(255, 255, 255, .8);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      background: #7dffb3;
      border-radius: 50%;
      animation: pulseDot 2s infinite;
    }

    .head-actions {
      display: flex;
      gap: 8px;
    }

    .head-btn {
      background: rgba(255, 255, 255, .18);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .head-btn:hover {
      background: rgba(255, 255, 255, .3);
    }

    /* Date chip */
    .date-chip {
      text-align: center;
      margin: 12px 0 4px;
    }

    .date-chip span {
      background: #e8f4fd;
      color: #6b7a99;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* Messages scroll area */
    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 14px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #eff8ff;
      background-image:
        radial-gradient(circle at 20px 20px, rgba(56, 182, 255, 0.04) 1px, transparent 1px),
        radial-gradient(circle at 60px 60px, rgba(56, 182, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
    }

    .chat-msgs::-webkit-scrollbar {
      width: 3px;
    }

    .chat-msgs::-webkit-scrollbar-thumb {
      background: rgba(0, 149, 255, .2);
      border-radius: 3px;
    }

    /* Welcome */
    .welcome-bubble {
      align-self: center;
      background: rgba(255, 255, 255, .85);
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 260px;
      text-align: center;
      margin: 16px 0;
      box-shadow: 0 2px 12px rgba(0, 100, 255, .08);
    }

    .welcome-bubble .w-icon {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .welcome-bubble p {
      font-size: 13px;
      color: #6b7a99;
      line-height: 1.5;
    }

    /* Message rows */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      animation: msgIn .25s ease both;
      max-width: 100%;
    }

    .msg-row.out {
      flex-direction: row-reverse;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .msg-av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .msg-av.bot-av {
      background: linear-gradient(135deg, #e8f4fd, #c5e5ff);
    }

    .msg-av.usr-av {
      background: linear-gradient(135deg, #0095ff, #38b6ff);
      color: #fff;
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      font-size: 12px;
    }

    .msg-bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 245px;
    }

    .msg-row.out .msg-bubble-wrap {
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      position: relative;
    }

    .msg-bubble.in {
      background: #fff;
      color: #2d3a52;
      border-bottom-left-radius: 5px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
    }

    .msg-bubble.out {
      background: linear-gradient(135deg, #0095ff, #38b6ff);
      color: #fff;
      border-bottom-right-radius: 5px;
      box-shadow: 0 2px 10px rgba(0, 149, 255, .3);
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-light);
      margin-top: 3px;
      padding: 0 4px;
    }

    .msg-row.out .msg-time {
      text-align: right;
      color: rgba(0, 149, 255, .7);
    }

    /* Typing indicator */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      animation: msgIn .25s ease both;
    }

    .typing-bubble {
      background: #fff;
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      padding: 12px 16px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background: #38b6ff;
      border-radius: 50%;
      animation: typingBounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .2s
    }

    .typing-dot:nth-child(3) {
      animation-delay: .4s
    }

    @keyframes typingBounce {

      0%,
      60%,
      100% {
        transform: translateY(0)
      }

      30% {
        transform: translateY(-7px)
      }
    }

    /* Input bar */
    .chat-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #fff;
      border-top: 1px solid rgba(56, 182, 255, .12);
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      border: 1.5px solid rgba(56, 182, 255, .25);
      border-radius: 24px;
      padding: 10px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-dark);
      outline: none;
      background: #f7fbff;
      transition: border-color .2s, box-shadow .2s;
    }

    .chat-input:focus {
      border-color: #38b6ff;
      box-shadow: 0 0 0 3px rgba(56, 182, 255, .12);
    }

    .chat-input::placeholder {
      color: #b0c4de
    }

    .send-btn {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #0095ff, #38b6ff);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(0, 149, 255, .4);
      transition: transform .15s, box-shadow .15s;
    }

    .send-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 5px 18px rgba(0, 149, 255, .5);
    }

    .send-btn:active {
      transform: scale(.95);
    }
  </style>
</head>

<body>

  <!-- ══════════ HERO PAGE ══════════ -->
  <div class="page">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="badge"><span class="badge-dot"></span>AI Powered Assistant</div>

    <h1 class="hero-title">
      Hi, <span class="grad">Vinayak</span> 👋
    </h1>
    <p class="hero-sub">Your personal AI assistant is ready.<br>Ask anything — I'm always here.</p>

    <div class="cards">
      <div class="card">
        <div class="card-icon">⚡</div>
        <div class="card-label">Instant Replies</div>
      </div>
      <div class="card">
        <div class="card-icon">🧠</div>
        <div class="card-label">Smart AI</div>
      </div>
      <div class="card">
        <div class="card-icon">🔒</div>
        <div class="card-label">Private & Secure</div>
      </div>
    </div>
  </div>

  <!-- ══════════ FAB BUTTON ══════════ -->
  <button id="fab" onclick="toggleChat()" title="Open Chat">💬</button>

  <!-- ══════════ CHAT WIDGET ══════════ -->
  <div id="chat-widget" class="hidden">

    <!-- Header -->
    <div class="chat-head">
      <div class="chat-head-avatar">🤖</div>
      <div class="chat-head-info">
        <div class="chat-head-name">AI Assistant</div>
        <div class="chat-head-status">
          <span class="online-dot"></span> Online · Ready to help
        </div>
      </div>
      <div class="head-actions">
        <button class="head-btn" onclick="clearChat()" title="Clear Chat">🗑️</button>
        <button class="head-btn" onclick="toggleChat()" title="Close">✕</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-msgs" id="msgBox">
      <div class="date-chip"><span>Today</span></div>
      <div class="welcome-bubble">
        <div class="w-icon">👋</div>
        <p>Hey Vinayak!<br>How can I help you today?</p>
      </div>
    </div>

    <!-- Input bar -->
    <div class="chat-bar">
      <input class="chat-input" id="chatInput" type="text" placeholder="Type a message..." onkeydown="handleKey(event)"
        autocomplete="off" />
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script>
    // ─── State ───────────────────────────────────
    let isOpen = false;
    let isTyping = false;

    const widget = document.getElementById('chat-widget');
    const fab = document.getElementById('fab');
    const msgBox = document.getElementById('msgBox');
    const chatInput = document.getElementById('chatInput');

    // ─── Toggle chat ─────────────────────────────
    function toggleChat() {
      isOpen = !isOpen;
      widget.classList.toggle('hidden', !isOpen);
      widget.classList.toggle('visible', isOpen);
      fab.textContent = isOpen ? '✕' : '💬';
      if (isOpen) { chatInput.focus(); scrollBottom(); }
    }

    // ─── Send message ─────────────────────────────
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isTyping) return;
      chatInput.value = '';
      appendMsg('out', text);
      showTyping();
      await getBotReply(text);
    }

    // ─── Append message bubble ────────────────────
    function appendMsg(dir, text) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const row = document.createElement('div');
      row.className = `msg-row ${dir}`;

      const av = document.createElement('div');
      av.className = dir === 'out' ? 'msg-av usr-av' : 'msg-av bot-av';
      av.textContent = dir === 'out' ? 'V' : '🤖';

      const wrap = document.createElement('div');
      wrap.className = 'msg-bubble-wrap';

      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${dir === 'out' ? 'out' : 'in'}`;
      bubble.textContent = text;

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = now;

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      row.appendChild(av);
      row.appendChild(wrap);
      msgBox.appendChild(row);
      scrollBottom();
    }

    // ─── Typing indicator ────────────────────────
    function showTyping() {
      isTyping = true;
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typingRow';

      const av = document.createElement('div');
      av.className = 'msg-av bot-av';
      av.textContent = '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'typing-bubble';
      bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

      row.appendChild(av);
      row.appendChild(bubble);
      msgBox.appendChild(row);
      scrollBottom();
    }

    function hideTyping() {
      const row = document.getElementById('typingRow');
      if (row) row.remove();
      isTyping = false;
    }

    // ─── Typing effect for bot reply ─────────────
    function typeMessage(text) {
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const row = document.createElement('div');
      row.className = 'msg-row';

      const av = document.createElement('div');
      av.className = 'msg-av bot-av';
      av.textContent = '🤖';

      const wrap = document.createElement('div');
      wrap.className = 'msg-bubble-wrap';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble in';
      bubble.textContent = '';

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = now;

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      row.appendChild(av);
      row.appendChild(wrap);
      msgBox.appendChild(row);

      let i = 0;
      function typeChar() {
        if (i < text.length) {
          bubble.textContent += text[i++];
          scrollBottom();
          setTimeout(typeChar, 22);
        }
      }
      typeChar();
    }

    // ─── Get bot reply ────────────────────────────
    // Tries real API at localhost:8000 first (api_server.py must be running)
    // Falls back to demo responses if API is unavailable.
    async function getBotReply(userText) {
      try {
        const res = await fetch('http://localhost:8000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userText }),
          signal: AbortSignal.timeout(5000)
        });
        if (res.ok) {
          const data = await res.json();
          hideTyping();
          typeMessage(data.reply);
          return;
        }
      } catch (e) {
        // API not available — use demo fallback
      }

      // Demo fallback
      await new Promise(r => setTimeout(r, 1400));
      hideTyping();
      const demos = [
        "That's a great question! Here's what I think...",
        "Sure! I can help you with that right away.",
        "Interesting! Let me help you figure that out.",
        "I'm on it! Give me just a moment.",
        "Absolutely! Happy to assist you, Vinayak.",
        "Good question! Here's my take on it."
      ];
      typeMessage(demos[Math.floor(Math.random() * demos.length)]);
    }

    // ─── Clear chat ───────────────────────────────
    function clearChat() {
      msgBox.innerHTML = '';
      const chip = document.createElement('div');
      chip.className = 'date-chip';
      chip.innerHTML = '<span>Today</span>';
      msgBox.appendChild(chip);

      const wb = document.createElement('div');
      wb.className = 'welcome-bubble';
      wb.innerHTML = '<div class="w-icon">👋</div><p>Chat cleared!<br>Start a new conversation.</p>';
      msgBox.appendChild(wb);
    }

    // ─── Scroll to bottom ─────────────────────────
    function scrollBottom() {
      msgBox.scrollTop = msgBox.scrollHeight;
    }
  </script>
</body>

</html>
